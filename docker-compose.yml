version: '3.8'

# ================================================================
# LuxeCraft Studio - Production Self-Hosted Containerized Stack
# ================================================================

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: luxecraft_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-luxecraft_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword123}
      POSTGRES_DB: ${DB_NAME:-luxecraft_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net

  # 2. Node.js Express API & Multer Processor
  backend:
    image: node:20-alpine
    container_name: luxecraft_api
    restart: always
    working_dir: /app
    command: sh -c "npm install && npx prisma migrate deploy && node server.js"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-luxecraft_user}:${DB_PASSWORD:-supersecretpassword123}@postgres:5432/${DB_NAME:-luxecraft_store}
      JWT_SECRET: ${JWT_SECRET:-generate-a-strong-random-32char-secret}
      UPLOAD_DIR: /var/www/uploads/samples
      NODE_ENV: production
      PORT: 5000
    volumes:
      - uploads_data:/var/www/uploads/samples
    depends_on:
      - postgres
    networks:
      - internal_net

  # 3. Static Web Frontend / Next.js
  web:
    image: nginx:alpine
    container_name: luxecraft_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - uploads_data:/var/www/uploads/samples:ro
    networks:
      - internal_net

volumes:
  postgres_data:
  uploads_data:

networks:
  internal_net:
    driver: bridge
